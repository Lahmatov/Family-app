# XcodeGen spec — the .xcodeproj is generated, never committed:
#   brew install xcodegen && cd ios && xcodegen
name: FamilyApp
options:
  bundleIdPrefix: app.family
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  FamilyCore:
    path: ../FamilyCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0" # stays below 3.0 (breaking API changes on main)
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FamilyApp:
    type: application
    platform: iOS
    sources:
      - path: FamilyApp
    dependencies:
      - package: FamilyCore
      - package: Supabase
        product: Supabase
    entitlements:
      path: FamilyApp/Resources/FamilyApp.entitlements
      properties:
        # Sign in with Apple needs a paid Apple Developer account; add
        # `com.apple.developer.applesignin: [Default]` once it is active.
        keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"]
    info:
      path: FamilyApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Family
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, pt-PT]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Face ID protects your family data."
        NSCameraUsageDescription: "Take photos of receipts and documents."
        NSPhotoLibraryUsageDescription: "Attach photos of receipts and documents."
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: app.family.auth
            CFBundleURLSchemes: [familyapp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.family.FamilyApp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
  FamilyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FamilyAppTests]
    dependencies:
      - target: FamilyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FamilyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FamilyAppUITests]
    dependencies:
      - target: FamilyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyApp:
    build:
      targets:
        FamilyApp: all
        FamilyAppTests: [test]
        FamilyAppUITests: [test]
    test:
      gatherCoverageData: true
      targets: [FamilyAppTests, FamilyAppUITests]
    run:
      config: Debug
