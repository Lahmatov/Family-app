name: FamilyCore (Swift, Linux)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build & test
        working-directory: FamilyCore
        run: swift test --parallel
