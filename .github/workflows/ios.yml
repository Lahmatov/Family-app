name: iOS app

# macOS runners are expensive: run only when app code changes, or by hand.
on:
  push:
    paths: ["ios/**", "FamilyCore/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit + UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project FamilyApp.xcodeproj -scheme FamilyApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions || exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ios/TestResults.xcresult
          retention-days: 7
