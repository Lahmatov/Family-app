name: Security scans

on:
  push:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets in full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep (secrets, Swift, GitHub Actions)
        run: semgrep scan --error --metrics=off --config p/secrets --config p/swift --config p/github-actions
